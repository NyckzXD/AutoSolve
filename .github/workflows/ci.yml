name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      # main.py depende de um Chrome local (porta 9222) e de Tkinter, então o fluxo
      # completo não roda num runner headless. Os testes cobrem a lógica pura (parsing
      # da resposta, prompt, assinatura) e o import do módulo, que não tem efeitos colaterais.
      - name: Run tests
        run: python -m pytest
